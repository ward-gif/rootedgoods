<!-- Preconnect voor Google Fonts en jsDelivr CDN — browser opent TCP+TLS
     connectie alvast terwijl HTML nog parseert. Scheelt 50-200ms per resource. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net">

<!-- Google Fonts — Montserrat (body) + Playfair Display (headings).
     BEWUST zonder ital-as: cursief hoort faux oblique te renderen (browser
     trekt de rechte letter schuin); de echte Playfair Italic is te sierlijk. -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Search overlay element — wordt via CSS/JS zichtbaar bij focus op zoekbalk -->
<div class="search-overlay" id="searchOverlay"></div>

<!-- CSS en JS worden globaal geladen door Promidata via jsDelivr CDN
     (in het thema): rootedgoods.css en rootedgoods.js@main -->

<!-- Sitebrede structured data (Organization + WebSite) — dit bestand laadt op
     elke pagina (zelfde plek als de zoek-overlay-div hierboven), dus hier
     hoeft dit maar 1x te staan. Nog GEEN sameAs (nog geen social-profielen)
     en bewust geen adres/telefoon (staat nergens publiek op de site).
     LET OP: als Shopware het <script type="application/ld+json"> uit een
     HTML-blok strípt bij opslaan, verplaats dit dan naar het thema (<head>)
     i.p.v. hier — zelfde risico als faq.html al documenteert. -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "Rooted Goods",
  "url": "https://rootedgoods.eu",
  "logo": "https://rootedgoods.eu/media/2a/71/e6/1786449349/Logo%20Rooted.svg",
  "description": "Rooted Goods personaliseert premium producten van Europese makers met jouw logo. Relatiegeschenken gemaakt in Europa.",
  "employee": [
    { "@type": "Person", "name": "Richard", "image": "https://rootedgoods.eu/media/6a/0f/ff/1782906551/Richardimg.jpg" },
    { "@type": "Person", "name": "Ward", "image": "https://rootedgoods.eu/media/4d/ea/dc/1786085851/Ward%20afbeelding.jpg" },
    { "@type": "Person", "name": "Marco", "image": "https://rootedgoods.eu/media/9c/98/c5/1786085851/Marco%20afbeelding.jpg" }
  ]
}
</script>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "Rooted Goods",
  "url": "https://rootedgoods.eu",
  "potentialAction": {
    "@type": "SearchAction",
    "target": "https://rootedgoods.eu/search?search={search_term_string}",
    "query-input": "required name=search_term_string"
  }
}
</script>
