<!-- ============================================================
     THEMA-OVERZICHT — plak dit in een CMS HTML-blok op de Thema's-pagina.
     - Eén tile met class "rg-theme-tile--feature" = uitgelicht (groot, 2x2).
       Geef die het seizoens-/actie-thema (bv. Winter & kerst in het najaar).
       Nu geen enkele tile uitgelicht (7 gelijke tiles) — voeg de class
       zelf toe aan de gewenste tile zodra je een seizoensthema wil pushen.
     - Vervang de href="#" door de juiste thema-URL.
     - Vervang de src="..." door een sfeerbeeld (liefst liggend, ~1200px breed).
     - Voeg gerust tiles toe/verwijder ze; de grid herschikt zichzelf.
     - .rg-theme-tile__eyebrow (badge) is optioneel — alleen op de feature gebruikt.
     - .rg-theme-tile__sub (subregel) is optioneel per tile.
     ============================================================ -->
<section class="rg-theme-section">
  <h2 class="rg-theme-heading">Shop op thema</h2>
  <p class="rg-theme-intro">Vind in één oogopslag de gelegenheid waar jij een cadeau voor zoekt — van seizoensmomenten tot onboarding en events.</p>

  <div class="rg-theme-grid">

    <a class="rg-theme-tile" href="#">
      <img class="rg-theme-tile__img" src="https://via.placeholder.com/600x600" alt="Zomer & zon">
      <span class="rg-theme-tile__body">
        <span><h3 class="rg-theme-tile__title">Zomer <span class="rg-amp">&amp;</span> zon</h3></span>
        <span class="rg-theme-tile__arrow" aria-hidden="true"></span>
      </span>
    </a>

    <a class="rg-theme-tile" href="#">
      <img class="rg-theme-tile__img" src="https://via.placeholder.com/600x600" alt="Winter & kerst">
      <span class="rg-theme-tile__body">
        <span><h3 class="rg-theme-tile__title">Winter <span class="rg-amp">&amp;</span> kerst</h3></span>
        <span class="rg-theme-tile__arrow" aria-hidden="true"></span>
      </span>
    </a>

    <a class="rg-theme-tile" href="#">
      <img class="rg-theme-tile__img" src="https://via.placeholder.com/600x600" alt="Brievenbus">
      <span class="rg-theme-tile__body">
        <span><h3 class="rg-theme-tile__title">Brievenbus</h3></span>
        <span class="rg-theme-tile__arrow" aria-hidden="true"></span>
      </span>
    </a>

    <a class="rg-theme-tile" href="#">
      <img class="rg-theme-tile__img" src="https://via.placeholder.com/600x600" alt="Made in NL">
      <span class="rg-theme-tile__body">
        <span><h3 class="rg-theme-tile__title">Made in NL</h3></span>
        <span class="rg-theme-tile__arrow" aria-hidden="true"></span>
      </span>
    </a>

    <a class="rg-theme-tile" href="#">
      <img class="rg-theme-tile__img" src="https://via.placeholder.com/600x600" alt="Events & conferenties">
      <span class="rg-theme-tile__body">
        <span><h3 class="rg-theme-tile__title">Events <span class="rg-amp">&amp;</span> conferenties</h3></span>
        <span class="rg-theme-tile__arrow" aria-hidden="true"></span>
      </span>
    </a>

    <a class="rg-theme-tile" href="#">
      <img class="rg-theme-tile__img" src="https://via.placeholder.com/600x600" alt="Onboarding & welkomstpakketten">
      <span class="rg-theme-tile__body">

        <span class="rg-theme-tile__arrow" aria-hidden="true"></span>
      </span>
    </a>

    <a class="rg-theme-tile" href="#">
      <img class="rg-theme-tile__img" src="https://via.placeholder.com/600x600" alt="Medewerker Merchandise">
      <span class="rg-theme-tile__body">
        <span><h3 class="rg-theme-tile__title">Medewerker Merchandise</h3></span>
        <span class="rg-theme-tile__arrow" aria-hidden="true"></span>
      </span>
    </a>

  </div>
</section>
