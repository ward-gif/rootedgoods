<!-- ============================================================
     SNIPPETS — kopieerbare HTML-onderdelen (iconen, entities, herbruikbare
     patronen) die al elders op de site gebruikt worden. Geen los CMS-blok,
     gewoon een naslag-bestand om uit te kopiëren bij nieuwe pagina's.
     ============================================================ -->


<!-- ------------------------------------------------------------
     1. SPECIALE TEKENS / HTML-ENTITIES
     ------------------------------------------------------------ -->

<!-- Ampersand in tekst/attributen: altijd &amp; typen, nooit los &.
     Anders breekt de HTML-parser (ziet het als begin van een entity). -->
&amp;

<!-- Sierlijke ampersand in koppen (bv. "Personalisatie & drukwerk"):
     Playfair's eigen '&'-glyph is lelijk/romeins, dus die wrappen we in
     .rg-amp (rootedgoods.css) -> italic Georgia-serif, klassieke fix.
     Gebruikt in services-overzicht.html en thema-overzicht.html. -->
<h3>Personalisatie <span class="rg-amp">&amp;</span> drukwerk</h3>

<!-- Non-breaking space: voorkomt regelafbreking tussen bv. "Van" en de prijs,
     of tussen een getal en eenheid (€&nbsp;25,43). -->
&nbsp;

<!-- Middot/bullet als scheidingsteken tussen inline items (bv. trust-strip:
     "Geassembleerd in Europa · digitale drukproef · bezorging geregeld").
     Wordt in de praktijk via CSS ::before content ingevoegd, niet handmatig
     getypt — zie .rg-hero-v2__t + .rg-hero-v2__t::before in rootedgoods.css. -->
&middot;
<!-- of als CSS content-waarde: content: "\00B7"; -->


<!-- ------------------------------------------------------------
     2. HERBRUIKBARE ICOON-SVG'S
     Allemaal aria-hidden="true" (decoratief) + fill/stroke="currentColor"
     zodat ze de tekstkleur van hun ouder-element overnemen — geen losse
     kleur-override nodig per plek.
     ------------------------------------------------------------ -->

<!-- Vinkje in cirkel — gebruikt voor trust-badges / checklist-items
     (bv. "Geassembleerd in Europa" in de hero, of feature-lijstjes). -->
<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M12 2a10 10 0 100 20 10 10 0 000-20zm-1.2 14.2L6.5 11.9l1.4-1.4 2.9 2.9 5.3-5.3 1.4 1.4z"/></svg>

<!-- Pijl naar rechts — gebruikt in hover-states (bv. het contactpersoon-
     blok "Ik help je van idee tot bezorging →", schuift op bij hover). -->
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>

<!-- LET OP: knoppen (.btn.btn-primary / .btn.btn-outline-primary) krijgen
     hun pijl AUTOMATISCH via CSS (::after in rootedgoods.css, sectie 8) —
     nooit handmatig een pijl/→ in de knoptekst zetten, dat geeft een
     dubbele pijl. Alleen als een knop een eigen <svg>/.icon bevat, slaat
     de auto-pijl vanzelf over (:not(:has(svg)) in de CSS-selector). -->


<!-- ------------------------------------------------------------
     3. KNOPPEN
     ------------------------------------------------------------ -->

<!-- Primair (gevuld, terracotta) + secundair (outline) — pijl komt vanzelf
     op de primaire; de secundaire heeft in sommige blokken (hero) een eigen
     ::after{display:none} override om 'm zonder pijl te tonen. -->
<div class="rg-page-hero__cta">
  <a class="btn btn-primary" href="#">Vraag een offerte aan</a>
  <a class="btn btn-outline-primary" href="#">Bekijk de collectie</a>
</div>

<!-- ------------------------------------------------------------
     8. CIRKEL-KNOP MET PIJL (mask-icon techniek, herbruikbaar)
     Gebruikt op thema-tegels/feature-cards/service-cards. Icoon is een
     data-URI SVG als CSS mask i.p.v. een los <svg>-element in de HTML —
     voordeel: kleur volgt puur background-color (geen los fill/stroke per
     plek), en de HTML blijft een lege <span>. Zie .rg-theme-tile__arrow
     in rootedgoods.css voor de volledige stijl (cirkel, hover-schuif +
     kleurwissel, transparant -> terracotta). -->
<span class="rg-theme-tile__arrow" aria-hidden="true"></span>


<!-- ------------------------------------------------------------
     9. GEGARANDEERD SYMMETRISCHE CHEVRON (CSS-only, geen SVG)
     Gebruikt voor de productslider-nav-knoppen (rootedgoods.css, sectie 30
     stap 5, op .base-slider-controls button .icon). Geen losse HTML-class
     hiervoor (staat rechtstreeks op de bestaande .icon-span) — dit is de
     kern-techniek om zelf te hergebruiken als je ooit weer een links/
     rechts-pijl-paar nodig hebt: twee randen van een vierkant (border-top +
     border-right), gespiegeld via rotate() i.p.v. twee losse getekende
     SVG-paden. Daardoor pixel-exact symmetrisch (een kant-en-klare SVG-
     chevron kan links/rechts net iets ongelijk "wegen" omdat het twee
     aparte tekeningen zijn). Kleur via border-color, dus ook makkelijk te
     hoveren/dimmen zonder fill-gedoe.

     CSS om te hergebruiken:
       .mijn-icoon{width:12px;height:12px;border-top:3px solid currentColor;border-right:3px solid currentColor;display:inline-block;}
       .mijn-icoon--links{transform:rotate(-135deg);}
       .mijn-icoon--rechts{transform:rotate(45deg);}
     -->


<!-- ------------------------------------------------------------
     10. OVERIGE CSS-TYPOGRAFIE/TOEGANKELIJKHEID-TRUCJES (geen HTML nodig,
     gewoon toe te passen via class/property in nieuwe CSS)
     ------------------------------------------------------------
     text-wrap: balance;
       -> op koppen: verdeelt de laatste regel evenwichtiger i.p.v. één
          eenzaam woord op de laatste regel. Gebruikt op .rgh__title en
          .rg-hero-v2__title.

     white-space: nowrap;  (bv. via een utility-class als .rg-hero-v2__nw)
       -> wrap een woordgroep die NIET los mag breken (bv. een woordspeling
          als "wortels in Europa") in een <span> met deze class.

     @media (prefers-reduced-motion: reduce) { ...transition: none !important; }
       -> zet decoratieve hover-transities uit voor bezoekers die "verminder
          beweging" aan hebben staan in hun OS. Overal waar iets schuift/
          fade't bij hover (tile-arrows, feature-cards) hoort dit erbij.
     ------------------------------------------------------------ -->
