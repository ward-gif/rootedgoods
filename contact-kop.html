     CONTACT-KOP — plak dit als CMS HTML-blok BOVEN het contactformulier.

<div class="rg-contact-head">
  <div class="rg-contact-head__team-chip">
    <span class="rg-contact-head__team-avatars">
      <img src="/media/6a/0f/ff/1782906551/Richardimg.jpg" alt="Richard" width="44" height="44">
      <img src="/media/4d/ea/dc/1786085851/Ward%20afbeelding.jpg" alt="Ward" width="44" height="44">
      <img src="/media/9c/98/c5/1786085851/Marco%20afbeelding.jpg" alt="Marco" width="44" height="44">
    </span>

  <h1 class="rg-contact-head__title">Neem contact op</h1>

    <span class="rg-contact-head__callcard-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
