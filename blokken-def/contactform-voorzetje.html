<div class="rg-contact-layout">
<form class="rg-cform" onsubmit="return false" aria-label="Contactformulier (voorbeeld)">
  <div class="rg-cform__grid">

    <div class="rg-cform__field">
      <label for="cf-voornaam">Voornaam</label>
      <input id="cf-voornaam" type="text" placeholder="Voer je voornaam in...">
    </div>
    <div class="rg-cform__field">
      <label for="cf-achternaam">Achternaam</label>
      <input id="cf-achternaam" type="text" placeholder="Voer je achternaam in...">
    </div>

    <div class="rg-cform__field">
      <label for="cf-email">E-mailadres</label>
      <input id="cf-email" type="email" placeholder="naam@bedrijf.nl">
    </div>
    <div class="rg-cform__field">
      <label for="cf-tel">Telefoon <span style="color:#8c857a;font-weight:400">(optioneel)</span></label>
      <input id="cf-tel" type="tel" placeholder="Voor snel telefonisch contact">
    </div>

    <div class="rg-cform__field rg-cform__field--full">
      <label for="cf-bedrijf">Bedrijf <span style="color:#8c857a;font-weight:400">(optioneel)</span></label>
      <input id="cf-bedrijf" type="text" placeholder="Naam van je organisatie">
    </div>

    <div class="rg-cform__field rg-cform__field--full">
      <label for="cf-onderwerp">Waar kunnen we je mee helpen?</label>
      <select id="cf-onderwerp">
        <option value="" disabled selected>Kies een onderwerp...</option>
        <option>Algemene vraag</option>
        <option>Offerte of prijsindicatie</option>
        <option>Vraag over een bestelling</option>
        <option>Personalisatie &amp; drukwerk</option>
        <option>Iets anders</option>
      </select>
    </div>

    <div class="rg-cform__field rg-cform__field--full">
      <label for="cf-bericht">Je bericht</label>
      <textarea id="cf-bericht" placeholder="Vertel ons waar je naar op zoek bent, dan denken we met je mee."></textarea>
    </div>

    <label class="rg-cform__privacy">
      <input type="checkbox">
      <span>Ik ga akkoord met het <a href="/privacy">privacybeleid</a>.</span>
    </label>

    <div class="rg-cform__foot">
      <p class="rg-cform__note">We reageren meestal binnen 24 uur.</p>
      <button type="submit" class="rg-cform__submit">Verstuur je bericht</button>
    </div>

  </div>
</form>

<a class="rg-contact-layout__callcard" data-cal-link="rootedgoods/kennismakingsgesprek" data-cal-namespace="kennismakingsgesprek" data-cal-config='{"layout":"month_view","theme":"light"}' role="button" tabindex="0" aria-label="Plan een belafspraak">
  <span class="rg-contact-layout__callcard-avatars">
    <img src="/media/6a/0f/ff/1782906551/Richardimg.jpg" alt="" width="40" height="40">
    <img src="/media/4d/ea/dc/1786085851/Ward%20afbeelding.jpg" alt="" width="40" height="40">
  </span>
  <span class="rg-contact-layout__callcard-title">Of plan een belafspraak</span>
  <span class="rg-contact-layout__callcard-sub">Liever even kennismaken in een call? We zien je graag daar!</span>
  <span class="rg-contact-layout__callcard-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
</a>
</div>
